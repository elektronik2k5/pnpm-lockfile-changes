name: Run tests and lint

on:
  - pull_request
  - workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.5.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm ci
      - run: pnpm lint
      - run: pnpm test
